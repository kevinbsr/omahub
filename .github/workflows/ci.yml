name: CI

on:
  push:
  pull_request:

# Third-party actions are pinned to a commit, not a tag: a tag is mutable and
# whoever can move it can run code in this workflow. The version each SHA
# corresponds to is in the comment beside it; bump both together.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate manifest
        run: python3 -m json.tool manifest.json >/dev/null
      - name: JavaScript tests
        run: node --test tests/*.test.cjs
      - name: Python tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
